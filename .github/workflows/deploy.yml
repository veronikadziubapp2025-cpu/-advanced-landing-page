name: CI/CD Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate required files and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail

          for file in index.html robots.txt sitemap.xml; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required file not found: $file"
              exit 1
            fi
          done

          js_files=()
          for directory in assets/js js; do
            if [[ -d "$directory" ]]; then
              while IFS= read -r -d '' file; do
                js_files+=("$file")
              done < <(find "$directory" -type f -name '*.js' -print0)
            fi
          done

          if [[ ${#js_files[@]} -eq 0 ]]; then
            echo "::error::No JavaScript files found in assets/js/ or js/"
            exit 1
          fi

          for file in "${js_files[@]}"; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Validate Vercel secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::GitHub Actions secret $name is not configured."
              exit 1
            fi
          done

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build for production
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt artifacts to production
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
